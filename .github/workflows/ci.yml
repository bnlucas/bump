name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
        env:
          # GitHub Packages tokens for the private @simbee-io / @shroudb /
          # @skeptik-io scopes. The repo secret must have read:packages.
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
      - run: npm run lint
      - run: npm test
      - run: npm run build
